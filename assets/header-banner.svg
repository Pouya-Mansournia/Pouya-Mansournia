<svg width="1600" height="520" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pouya Mansournia — Robotics Engineer, Technical Founder, Product Leader. Light engineering dashboard theme with robotic arm, AMR, and system panels for AI, capabilities, automation, tech stack and deployment.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#faf3e6"/>
      <stop offset="1" stop-color="#f0e6d2"/>
    </linearGradient>
    <linearGradient id="road" x1="300" y1="520" x2="1050" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a9bf78" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a9bf78" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6b2e"/>
      <stop offset="1" stop-color="#7c2d3a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>

  <!-- confetti triangles -->
  <g opacity="0.5">
    <polygon points="120,60 150,110 90,110" fill="#cdd8a3"/>
    <polygon points="1500,40 1535,95 1465,95" fill="#a9525f"/>
    <polygon points="1420,420 1460,470 1380,470" fill="#e3d5ad"/>
    <polygon points="1120,60 1150,100 1090,100" fill="#a9bf78"/>
    <polygon points="980,440 1015,480 945,480" fill="#cdd8a3"/>
    <polygon points="1290,300 1315,335 1265,335" fill="#e3d5ad"/>
  </g>

  <!-- soft city silhouette -->
  <g opacity="0.35" fill="#c3b896">
    <rect x="880" y="260" width="30" height="180"/>
    <rect x="920" y="210" width="24" height="230"/>
    <rect x="955" y="280" width="34" height="160"/>
    <rect x="1000" y="240" width="22" height="200"/>
  </g>

  <!-- glowing road -->
  <path d="M 300 520 C 480 420, 620 380, 760 340 C 900 300, 980 260, 1060 205" stroke="url(#road)" stroke-width="34" fill="none" stroke-linecap="round"/>
  <path d="M 300 520 C 480 420, 620 380, 760 340 C 900 300, 980 260, 1060 205" stroke="#7c2d3a" stroke-width="2" fill="none" stroke-dasharray="1 14" opacity="0.7"/>

  <!-- robotic arm (simplified) -->
  <g transform="translate(430,330)" stroke="#3a3322" stroke-width="10" stroke-linecap="round" fill="none">
    <circle cx="0" cy="70" r="24" fill="#efe6d3" stroke="#a89a72" stroke-width="6"/>
    <line x1="0" y1="70" x2="-40" y2="-10"/>
    <line x1="-40" y1="-10" x2="20" y2="-70"/>
    <line x1="20" y1="-70" x2="60" y2="-40"/>
    <circle cx="-40" cy="-10" r="8" fill="#5b6b2e"/>
    <circle cx="20" cy="-70" r="8" fill="#5b6b2e"/>
  </g>
  <ellipse cx="430" cy="404" rx="60" ry="10" fill="#d9cba3" opacity="0.6"/>

  <!-- AMR robot -->
  <g transform="translate(605,420)">
    <rect x="-46" y="-24" width="92" height="46" rx="10" fill="#faf3e6" stroke="#a89a72" stroke-width="3"/>
    <rect x="-30" y="-8" width="60" height="10" rx="4" fill="#7c2d3a"/>
    <circle cx="-28" cy="26" r="9" fill="#3a3322"/>
    <circle cx="28" cy="26" r="9" fill="#3a3322"/>
    <circle cx="0" cy="-24" r="4" fill="#7c2d3a"/>
  </g>

  <!-- title -->
  <text x="500" y="90" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#2e2a1a">Pouya Mansournia</text>
  <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5b6b2e" letter-spacing="0.5">Robotics Engineer   ·   Technical Founder   ·   Product Leader</text>

  <!-- left domain hexes -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(50,60)">
      <polygon points="30,0 56,15 56,45 30,60 4,45 4,15" fill="none" stroke="#5b6b2e" stroke-width="2"/>
      <path d="M22,26 a8,8 0 1,1 16,0 a8,8 0 1,1 -16,0 M30,34 v10" stroke="#5b6b2e" stroke-width="2" fill="none"/>
      <text x="76" y="16" font-size="15" font-weight="700" fill="#2e2a1a">AI &amp; SOFTWARE</text>
      <text x="76" y="34" font-size="11.5" fill="#7a7256">Agentic AI</text>
      <text x="76" y="50" font-size="11.5" fill="#7a7256">Automation</text>
      <text x="76" y="66" font-size="11.5" fill="#7a7256">System Architecture</text>
    </g>
    <g transform="translate(50,168)">
      <polygon points="30,0 56,15 56,45 30,60 4,45 4,15" fill="none" stroke="#5b6b2e" stroke-width="2"/>
      <path d="M14,30 h32 M30,14 v32" stroke="#5b6b2e" stroke-width="2"/>
      <text x="76" y="16" font-size="15" font-weight="700" fill="#2e2a1a">ROBOTICS &amp; AMR</text>
      <text x="76" y="34" font-size="11.5" fill="#7a7256">ROS 2 · Navigation</text>
      <text x="76" y="50" font-size="11.5" fill="#7a7256">Fleet Systems</text>
      <text x="76" y="66" font-size="11.5" fill="#7a7256">Warehouse Automation</text>
    </g>
    <g transform="translate(50,276)">
      <polygon points="30,0 56,15 56,45 30,60 4,45 4,15" fill="none" stroke="#8b3a3a" stroke-width="2"/>
      <rect x="20" y="20" width="20" height="20" fill="none" stroke="#8b3a3a" stroke-width="2"/>
      <text x="76" y="16" font-size="15" font-weight="700" fill="#2e2a1a">PRECISION SYSTEMS</text>
      <text x="76" y="34" font-size="11.5" fill="#7a7256">Flexures · Piezo</text>
      <text x="76" y="50" font-size="11.5" fill="#7a7256">Closed-Loop Control</text>
      <text x="76" y="66" font-size="11.5" fill="#7a7256">Mechanism Design</text>
    </g>
    <g transform="translate(50,384)">
      <polygon points="30,0 56,15 56,45 30,60 4,45 4,15" fill="none" stroke="#7c5a2d" stroke-width="2"/>
      <rect x="20" y="20" width="20" height="20" rx="4" fill="none" stroke="#7c5a2d" stroke-width="2"/>
      <text x="76" y="16" font-size="15" font-weight="700" fill="#2e2a1a">EMBEDDED &amp; IOT</text>
      <text x="76" y="34" font-size="11.5" fill="#7a7256">STM32 · ESP32</text>
      <text x="76" y="50" font-size="11.5" fill="#7a7256">Sensors &amp; Connectivity</text>
      <text x="76" y="66" font-size="11.5" fill="#7a7256">Real-Time Control</text>
    </g>
  </g>

  <!-- right panels -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- AI orchestration -->
    <g transform="translate(1050,50)">
      <rect width="230" height="150" rx="12" fill="#ffffff" fill-opacity="0.75" stroke="#ddd0ac"/>
      <text x="18" y="26" font-size="12" font-weight="700" fill="#2e2a1a" letter-spacing="0.5">AI ORCHESTRATION</text>
      <g stroke="#5b6b2e" fill="#5b6b2e" opacity="0.9">
        <circle cx="60" cy="70" r="2.6"/><circle cx="100" cy="55" r="2.6"/><circle cx="100" cy="90" r="2.6"/>
        <circle cx="150" cy="70" r="2.6"/><circle cx="180" cy="95" r="2.6"/><circle cx="180" cy="45" r="2.6"/>
        <line x1="60" y1="70" x2="100" y2="55" stroke-width="0.9"/>
        <line x1="60" y1="70" x2="100" y2="90" stroke-width="0.9"/>
        <line x1="100" y1="55" x2="150" y2="70" stroke-width="0.9"/>
        <line x1="100" y1="90" x2="150" y2="70" stroke-width="0.9"/>
        <line x1="150" y1="70" x2="180" y2="95" stroke-width="0.9"/>
        <line x1="150" y1="70" x2="180" y2="45" stroke-width="0.9"/>
      </g>
      <g font-size="10.5" fill="#6e6748">
        <text x="18" y="122">Models</text><text x="70" y="122">Agents</text>
        <text x="120" y="122">Data</text><text x="165" y="122">Tools</text>
      </g>
    </g>

    <!-- system status -->
    <g transform="translate(1300,50)">
      <rect width="250" height="150" rx="12" fill="#ffffff" fill-opacity="0.75" stroke="#ddd0ac"/>
      <text x="18" y="26" font-size="12" font-weight="700" fill="#2e2a1a" letter-spacing="0.5">SYSTEM STATUS</text>
      <g font-size="11.5" fill="#3a3322">
        <circle cx="24" cy="48" r="4" fill="#6f8f3f"/><text x="36" y="52">Navigation</text>
        <circle cx="24" cy="72" r="4" fill="#6f8f3f"/><text x="36" y="76">Sensor Fusion</text>
        <circle cx="24" cy="96" r="4" fill="#5b6b2e"/><text x="36" y="100">Fleet Sync</text>
        <circle cx="24" cy="120" r="4" fill="#6f8f3f"/><text x="36" y="124">Deployment</text>
      </g>
    </g>

    <!-- capabilities -->
    <g transform="translate(1050,220)">
      <rect width="230" height="90" rx="12" fill="#ffffff" fill-opacity="0.75" stroke="#ddd0ac"/>
      <text x="18" y="24" font-size="12" font-weight="700" fill="#2e2a1a" letter-spacing="0.5">CAPABILITIES</text>
      <g font-size="10" fill="#6e6748">
        <text x="20" y="60">Perception</text>
        <text x="105" y="60">Planning</text>
        <text x="180" y="60">Control</text>
        <text x="20" y="78">Sensing</text>
        <text x="105" y="78">Mapping</text>
        <text x="180" y="78">Actuation</text>
      </g>
    </g>

    <!-- automation pipeline -->
    <g transform="translate(1300,220)">
      <rect width="250" height="90" rx="12" fill="#ffffff" fill-opacity="0.75" stroke="#ddd0ac"/>
      <text x="18" y="24" font-size="12" font-weight="700" fill="#2e2a1a" letter-spacing="0.5">ENGINEERING PIPELINE</text>
      <g font-size="10" fill="#6e6748" text-anchor="middle">
        <text x="35" y="58">Design</text><text x="90" y="58">Build</text>
        <text x="140" y="58">Validate</text><text x="195" y="58">Deploy</text>
        <text x="225" y="58">Monitor</text>
      </g>
      <g stroke="#5b6b2e" stroke-width="1.2" opacity="0.7">
        <line x1="50" y1="52" x2="70" y2="52"/><line x1="105" y1="52" x2="120" y2="52"/>
        <line x1="160" y1="52" x2="175" y2="52"/><line x1="210" y1="52" x2="215" y2="52"/>
      </g>
    </g>

    <!-- tech stack -->
    <g transform="translate(1050,325)">
      <rect width="500" height="66" rx="12" fill="#ffffff" fill-opacity="0.75" stroke="#ddd0ac"/>
      <text x="18" y="22" font-size="12" font-weight="700" fill="#2e2a1a" letter-spacing="0.5">TECH STACK</text>
      <g font-size="10.5" fill="#3a3322">
        <text x="18" y="46">Python</text><text x="78" y="46">C / C++</text>
        <text x="150" y="46">ROS 2</text><text x="205" y="46">STM32</text>
        <text x="268" y="46">ESP32</text><text x="330" y="46">Docker</text>
        <text x="395" y="46">SolidWorks</text>
      </g>
    </g>

    <!-- deployment map -->
    <g transform="translate(1050,405)">
      <rect width="500" height="90" rx="12" fill="#ffffff" fill-opacity="0.75" stroke="#ddd0ac"/>
      <text x="18" y="24" font-size="12" font-weight="700" fill="#2e2a1a" letter-spacing="0.5">ENGINEERING DOMAINS</text>
      <g font-size="10.5" fill="#6e6748">
        <text x="18" y="52">Robotics</text><text x="120" y="52">Mechatronics</text>
        <text x="250" y="52">Embedded</text><text x="360" y="52">Product</text>
        <text x="18" y="74">Autonomy</text><text x="120" y="74">Precision Motion</text>
        <text x="250" y="74">AI Systems</text><text x="360" y="74">Founder Ops</text>
      </g>
    </g>
  </g>

  <!-- footer -->
  <line x1="0" y1="480" x2="1600" y2="480" stroke="#e2e2da"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6e6748" text-anchor="middle">
    <text x="300" y="505">Mechanism</text>
    <text x="500" y="505">Systems</text>
    <text x="700" y="505">Product</text>
    <text x="900" y="505">Deployment</text>
  </g>
  <g stroke="#5b6b2e" stroke-width="1.2" opacity="0.6">
    <line x1="340" y1="500" x2="460" y2="500"/>
    <line x1="540" y1="500" x2="660" y2="500"/>
    <line x1="740" y1="500" x2="860" y2="500"/>
  </g>
</svg>
