<svg width="1200" height="400" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pouya Mansournia — Robotics Engineer, Technical Founder, Product Leader. Dark engineering dashboard theme with domain panels for AI, robotics, embedded systems and product systems.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040815"/>
      <stop offset="0.55" stop-color="#071023"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="cityGlow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#0f2036" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="400" fill="url(#cityGlow)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#glowCyan)"/>
  <rect x="0" y="397" width="1200" height="3" fill="url(#glowCyan)"/>

  <!-- city skyline silhouette -->
  <g opacity="0.5" fill="#0c1b30" stroke="#12314f" stroke-width="1">
    <rect x="520" y="300" width="24" height="100"/>
    <rect x="552" y="260" width="20" height="140"/>
    <rect x="580" y="320" width="30" height="80"/>
    <rect x="618" y="280" width="18" height="120"/>
    <rect x="644" y="330" width="26" height="70"/>
    <rect x="680" y="250" width="22" height="150"/>
    <rect x="712" y="300" width="20" height="100"/>
  </g>
  <g stroke="#22d3ee" stroke-width="1" opacity="0.35">
    <line x1="524" y1="300" x2="524" y2="400"/>
    <line x1="622" y1="280" x2="622" y2="400"/>
    <line x1="684" y1="250" x2="684" y2="400"/>
  </g>

  <!-- AMR path trail -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 470 400 C 500 360, 560 350, 600 370 C 650 395, 700 330, 760 320"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="600" cy="370" r="3"/>
    <circle cx="760" cy="320" r="3"/>
  </g>
  <!-- simple AMR glyph -->
  <g transform="translate(455,368)">
    <rect x="-22" y="-10" width="44" height="22" rx="5" fill="#0c1b30" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="-14" y="-2" width="28" height="6" fill="#22d3ee" opacity="0.8"/>
    <circle cx="-14" cy="12" r="4" fill="#0a1730" stroke="#22d3ee" stroke-width="1.2"/>
    <circle cx="14" cy="12" r="4" fill="#0a1730" stroke="#22d3ee" stroke-width="1.2"/>
  </g>

  <!-- left domain list -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(40,54)">
      <circle r="15" fill="none" stroke="#22d3ee" stroke-width="1.3"/>
      <path d="M-6,-3 L0,-8 L6,-3 M-6,3 L0,8 L6,3" stroke="#22d3ee" stroke-width="1.2" fill="none"/>
      <text x="30" y="-2" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">AI &amp; SOFTWARE</text>
      <text x="30" y="15" font-size="10.5" fill="#64748b">Agentic AI · Automation · Architecture</text>
    </g>
    <g transform="translate(40,114)">
      <circle r="15" fill="none" stroke="#0ea5e9" stroke-width="1.3"/>
      <path d="M-7,0 h14 M0,-7 v14" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="30" y="-2" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">ROBOTICS &amp; AMR</text>
      <text x="30" y="15" font-size="10.5" fill="#64748b">ROS 2 · Navigation · Fleet Systems</text>
    </g>
    <g transform="translate(40,174)">
      <circle r="15" fill="none" stroke="#f59e0b" stroke-width="1.3"/>
      <rect x="-6" y="-6" width="12" height="12" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="30" y="-2" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">PRECISION SYSTEMS</text>
      <text x="30" y="15" font-size="10.5" fill="#64748b">Flexures · Piezo · Closed-Loop Control</text>
    </g>
    <g transform="translate(40,234)">
      <circle r="15" fill="none" stroke="#818cf8" stroke-width="1.3"/>
      <rect x="-6" y="-6" width="12" height="12" rx="3" fill="none" stroke="#818cf8" stroke-width="1.2"/>
      <text x="30" y="-2" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">EMBEDDED &amp; IOT</text>
      <text x="30" y="15" font-size="10.5" fill="#64748b">STM32 · ESP32 · Sensors · Connectivity</text>
    </g>
    <g transform="translate(40,294)">
      <circle r="15" fill="none" stroke="#34d399" stroke-width="1.3"/>
      <path d="M-6,6 L0,-7 L6,6 Z" fill="none" stroke="#34d399" stroke-width="1.2"/>
      <text x="30" y="-2" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">PRODUCT &amp; FOUNDER</text>
      <text x="30" y="15" font-size="10.5" fill="#64748b">Strategy · Systems Ownership · GTM</text>
    </g>
  </g>

  <!-- title -->
  <text x="380" y="70" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">Pouya Mansournia</text>
  <text x="382" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#22d3ee" letter-spacing="0.5">Robotics Engineer  ·  Technical Founder  ·  Product Leader</text>

  <!-- right telemetry panels (no invented metrics — status/graph glyphs only) -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(800,40)">
      <rect width="190" height="90" rx="6" fill="#0a1626" stroke="#173252" stroke-width="1"/>
      <text x="12" y="20" font-size="10" fill="#64748b" letter-spacing="0.5">SYSTEM STATUS</text>
      <circle cx="16" cy="38" r="4" fill="#34d399"/>
      <text x="28" y="42" font-size="11" fill="#cbd5e1">Navigation</text>
      <circle cx="16" cy="58" r="4" fill="#34d399"/>
      <text x="28" y="62" font-size="11" fill="#cbd5e1">Sensor Fusion</text>
      <circle cx="16" cy="78" r="4" fill="#22d3ee"/>
      <text x="28" y="82" font-size="11" fill="#cbd5e1">Fleet Sync</text>
    </g>

    <g transform="translate(1005,40)">
      <rect width="155" height="90" rx="6" fill="#0a1626" stroke="#173252" stroke-width="1"/>
      <text x="12" y="20" font-size="10" fill="#64748b" letter-spacing="0.5">AI ORCHESTRATION</text>
      <g stroke="#818cf8" stroke-width="1" fill="#818cf8" opacity="0.9">
        <circle cx="35" cy="55" r="2.4"/>
        <circle cx="70" cy="45" r="2.4"/>
        <circle cx="70" cy="72" r="2.4"/>
        <circle cx="110" cy="55" r="2.4"/>
        <circle cx="130" cy="70" r="2.4"/>
        <line x1="35" y1="55" x2="70" y2="45" stroke-width="0.8"/>
        <line x1="35" y1="55" x2="70" y2="72" stroke-width="0.8"/>
        <line x1="70" y1="45" x2="110" y2="55" stroke-width="0.8"/>
        <line x1="70" y1="72" x2="110" y2="55" stroke-width="0.8"/>
        <line x1="110" y1="55" x2="130" y2="70" stroke-width="0.8"/>
      </g>
    </g>

    <g transform="translate(800,145)">
      <rect width="190" height="70" rx="6" fill="#0a1626" stroke="#173252" stroke-width="1"/>
      <text x="12" y="18" font-size="10" fill="#64748b" letter-spacing="0.5">ACTIVITY TREND</text>
      <polyline points="14,52 40,44 66,50 92,32 118,38 144,22 170,28" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
    </g>

    <g transform="translate(1005,145)">
      <rect width="155" height="70" rx="6" fill="#0a1626" stroke="#173252" stroke-width="1"/>
      <text x="12" y="18" font-size="10" fill="#64748b" letter-spacing="0.5">DEPLOYMENT MAP</text>
      <g fill="#22d3ee">
        <circle cx="30" cy="45" r="2"/>
        <circle cx="60" cy="38" r="2"/>
        <circle cx="90" cy="52" r="2"/>
        <circle cx="120" cy="42" r="2"/>
      </g>
      <path d="M8,55 h140" stroke="#173252" stroke-width="1"/>
    </g>

    <g transform="translate(800,225)">
      <rect width="360" height="46" rx="6" fill="#0a1626" stroke="#173252" stroke-width="1"/>
      <text x="14" y="18" font-size="10" fill="#64748b" letter-spacing="0.5">SAAS &amp; SYSTEMS ARCHITECTURE</text>
      <g font-size="10.5" fill="#94a3b8">
        <text x="14" y="36">Web App</text>
        <text x="90" y="36">API</text>
        <text x="140" y="36">Edge Devices</text>
        <text x="230" y="36">Data Pipeline</text>
      </g>
    </g>
  </g>

  <text x="600" y="382" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#475569" letter-spacing="1.5">MECHANISM · SOFTWARE · DEPLOYMENT · PRODUCT</text>
</svg>
