      .domain { fill:#111827; stroke:#3b82f6; stroke-width:1.6; }
      .edge   { stroke:#334155; stroke-width:1.2; }
      .edge2  { stroke:#1f2937; stroke-width:1; }
      .lbl    { font-family:'Segoe UI', Helvetica, Arial, sans-serif; fill:#e2e8f0; }
      .lbl-d  { font-family:'Segoe UI', Helvetica, Arial, sans-serif; fill:#22d3ee; font-weight:700; }
      .lbl-s  { font-family:'Segoe UI', Helvetica, Arial, sans-serif; fill:#94a3b8; font-size:11px; }
      .tag    { fill:#0b1220; stroke:#243044; stroke-width:1; }
      .tag-t  { font-family:'Segoe UI', Helvetica, Arial, sans-serif; fill:#64748b; font-size:10px; }
    </style>
  </defs>
  <rect width="1000" height="560" fill="#0b0f17"/>

  <!-- core node -->
  <circle cx="500" cy="280" r="42" class="core"/>
