<svg width="1000" height="560" viewBox="0 0 1000 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering system map of Pouya Mansournia's work across robotics, precision engineering, embedded and software systems, and product">
  <defs>
    <style>
      .node   { fill:#111827; stroke:#334155; stroke-width:1.4; }
